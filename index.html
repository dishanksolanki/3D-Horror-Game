<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Haveli of Shadows — Room 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Cormorant Garamond', serif;}
  canvas{display:block;}

  #loading{
    position:fixed;inset:0;background:#050403;z-index:20;
    display:flex;align-items:center;justify-content:center;color:#7a5f3a;
    letter-spacing:4px;font-size:0.85em;text-transform:uppercase;font-style:italic;
    transition:opacity 0.6s ease;
  }
  #loading::after{content:'';width:14px;height:14px;margin-left:12px;border:1px solid #7a5f3a;border-top-color:transparent;border-radius:50%;animation:spin 0.9s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #overlay{
    position:fixed;inset:0;
    background:radial-gradient(ellipse at 50% 45%, rgba(20,14,8,0.55) 0%, rgba(0,0,0,0.97) 75%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#c9a876;text-align:center;z-index:10;cursor:pointer;
    transition:opacity 0.9s ease;
  }
  #overlay .frame{
    padding:50px 70px;border:1px solid rgba(180,140,80,0.25);
    position:relative;
  }
  #overlay .frame::before, #overlay .frame::after{
    content:'';position:absolute;width:22px;height:22px;
    border:1px solid rgba(212,162,78,0.55);
  }
  #overlay .frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  #overlay .frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  #overlay .eyebrow{
    font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:3px;
    font-size:0.95em;opacity:0.55;margin-bottom:6px;
  }
  #overlay h1{
    font-family:'Eczar',serif;font-size:2.6em;letter-spacing:2px;margin:0 0 18px 0;color:#d9ac5c;
    text-shadow:0 0 25px rgba(200,120,20,0.45), 0 0 60px rgba(0,0,0,0.9);
    font-weight:700;
  }
  #overlay p{opacity:0.8;margin:5px 0;font-size:1.15em;letter-spacing:0.5px;}
  #overlay .controls-row{
    margin-top:18px;display:flex;gap:22px;font-size:0.95em;opacity:0.65;
    justify-content:center;flex-wrap:wrap;
  }
  #overlay .controls-row span{border-left:1px solid rgba(180,140,80,0.3);padding-left:22px;}
  #overlay .controls-row span:first-child{border-left:none;padding-left:0;}
  #overlay .hint{margin-top:34px;font-size:0.85em;letter-spacing:2px;text-transform:uppercase;opacity:0.5;animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:0.25}50%{opacity:0.75}}

  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    box-shadow: inset 0 0 260px 100px rgba(0,0,0,0.95);
    mix-blend-mode:multiply;
  }
  #grain{
    position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  #hud{
    position:fixed;top:16px;left:20px;color:#8a6d4b;font-size:12px;letter-spacing:3px;
    z-index:4;opacity:0.5;text-transform:uppercase;pointer-events:none;font-family:'Cormorant Garamond',serif;
  }
  #hud small{display:block;font-size:9px;opacity:0.7;letter-spacing:2px;margin-top:2px;}
  #crosshair{
    position:fixed;top:50%;left:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
    background:rgba(220,190,140,0.55);border-radius:50%;z-index:4;pointer-events:none;
    box-shadow:0 0 4px rgba(220,190,140,0.4);
  }
  #interact-hint{
    position:fixed;top:58%;left:50%;transform:translate(-50%,0);
    color:#d9c9a0;font-size:13px;letter-spacing:2px;text-transform:uppercase;
    z-index:4;pointer-events:none;opacity:0;transition:opacity 0.15s ease;
    text-shadow:0 0 6px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

<div id="loading">entering the haveli…</div>
<div id="overlay">
  <div class="frame">
    <div class="eyebrow">Haveli of Shadows</div>
    <h1>&#2361;&#2366;&#2357;&#2375;&#2354;&#2368; &#2325;&#2366; &#2325;&#2350;&#2352;&#2366; &#8212; ROOM 1</h1>
    <p>An old bedroom. The bulb still swings, though no one touched it.</p>
    <div class="controls-row">
      <span>WASD / Arrows — move</span>
      <span>Mouse — look</span>
      <span>ESC — release cursor</span>
    </div>
    <div class="hint">click anywhere to enter</div>
  </div>
</div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="hud">Room 01<small>Sone ka Kamra</small></div>
<div id="crosshair"></div>
<div id="interact-hint">click to open / close</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/room1.js"></script>
<script src="js/room2.js"></script>
<script src="js/room3.js"></script>
<script src="js/washroom1.js"></script>
<script src="js/main.js"></script>
</body>
</html>
